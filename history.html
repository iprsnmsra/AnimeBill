<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeBill - Bill History Dashboard</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Exo+2:wght@300;400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1 class="logo">🎌 AnimeBill</h1>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">← Generator</a>
            </nav>
            <div id="authZone" class="auth-zone">
                <!-- Auth state will be injected here -->
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Stats Section -->
        <section id="statsSection" class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📜</div>
                <div class="stat-info">
                    <div class="stat-label">Total Bills</div>
                    <div class="stat-value" id="statTotalBills">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-info">
                    <div class="stat-label">Total Revenue</div>
                    <div class="stat-value" id="statRevenue">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <div class="stat-label">Avg Bill Value</div>
                    <div class="stat-value" id="statAvgBill">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎌</div>
                <div class="stat-info">
                    <div class="stat-label">Favorite Character</div>
                    <div class="stat-value" id="statFavChar">-</div>
                </div>
            </div>
        </section>

        <!-- Controls Bar -->
        <section class="controls-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search bills...">
            </div>
            <div class="controls-actions">
                <select id="sortSelect" class="dark-select">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="highest">Highest</option>
                    <option value="lowest">Lowest</option>
                </select>
                <button id="exportBtn" class="btn btn-accent">Export CSV</button>
            </div>
        </section>

        <!-- Bills Grid -->
        <section id="billsGrid" class="bills-grid">
            <!-- Bill cards will be injected here -->
        </section>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state hidden">
            <div class="empty-icon">😢</div>
            <h2>No bills generated yet!</h2>
            <p>Go create your first anime bill! 🎌</p>
            <a href="index.html" class="btn btn-primary">Go to Generator</a>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination">
            <button id="prevPage" class="btn btn-nav" disabled>Prev</button>
            <span id="pageInfo" class="page-info">Page 1</span>
            <button id="nextPage" class="btn btn-nav" disabled>Next</button>
        </div>
    </main>

    <!-- Bill Detail Modal -->
    <div id="billModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalBillNo">Bill Details</h2>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal details injected here -->
            </div>
        </div>
    </div>

    <footer class="app-footer">
        <p>AnimeBill v2.0 · <a href="https://github.com/iprsnmsra">github.com/iprsnmsra</a></p>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
